{% macro book_card(book, number) %}
<article class="book-card"><div class="book-cover {{ book.color }}" aria-hidden="true"><span class="cover-author">{{ book.author }}</span><strong>{{ book.title }}</strong><span class="cover-bottom">УКРАЇНСЬКА КЛАСИКА <span>{{ '%02d' | format(number) }}</span></span></div><div class="book-meta"><span class="genre">{{ book.genre }}</span><h3>{{ book.title }}</h3><p>{{ book.author }}</p></div></article>
{% endmacro %}
